<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a4f47" />
<meta name="mobile-web-app-capable" content="yes" />
<title>ขอป้ายราคา</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script>
/* =====================================================================
 *  ตั้งค่า (แก้ที่นี่ที่เดียว แล้ว commit ขึ้น GitHub)
 * ===================================================================== */
window.CONFIG = {
  // วาง Google Apps Script Web App URL (ลงท้ายด้วย /exec)
  SHEET_URL: "https://script.google.com/macros/s/AKfycbwx5SoUdGXEgUiC_VrU72k5d4XDt7ARs3YkM5Pgv0o98NXclWPTH_N8EyjB95gHI_xV5A/exec",
  // ชื่อสาขา (เปลี่ยนต่อเครื่องได้ด้วยลิงก์ ...index.html?branch=ชื่อสาขา)
  BRANCH: "สาขาสุพรรณบุรี",
  // ขนาดป้ายเริ่มต้น (หรือ ?size=A5)
  DEFAULT_SIZE: "A4",
  // ไฟล์ฐานข้อมูลสินค้า (สร้างจาก data/DataItem.xlsx)
  PRODUCTS_URL: "products.json",
  // เสียง/สั่นเมื่อสแกน
  BEEP: true,
  // ดึงรายการจากชีตทุกกี่วินาที (สะท้อนการลบ/แก้ไขจากหลังบ้าน)
  SYNC_SECONDS: 20,
  // เปิดปุ่มกล้องสำหรับมือถือที่ไม่มีหัวสแกน (true/false)
  ENABLE_CAMERA: false
};
</script>
<style>
  :root{
    --bg:#eef2f0; --surface:#fff; --ink:#0f1f1c; --muted:#61716d; --faint:#94a3a0; --line:#e2e8e6;
    --brand:#0d6b5f; --brand-dark:#0a4f47; --brand-soft:#e3f1ee;
    --ok:#15803d; --ok-soft:#e8f6ec; --warn:#b45309; --warn-soft:#fdf3e3; --err:#b91c1c; --err-soft:#fdecec;
    --radius:16px; --pad:12px;
    --sans:"IBM Plex Sans Thai","Noto Sans Thai","Sarabun","Leelawadee UI",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;
    -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  svg{display:block}

  /* ---------- Header ---------- */
  header{position:sticky;top:0;z-index:20;background:var(--brand-dark);color:#fff;
    padding:9px var(--pad) 10px;box-shadow:0 6px 20px rgba(10,79,71,.25)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:8px;min-width:0}
  .brand .logo{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:0 0 auto}
  .brand h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.1px;white-space:nowrap}
  .branch{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;background:rgba(255,255,255,.12);
    padding:4px 10px 4px 7px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}

  .seg-label{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;
    letter-spacing:.4px;color:rgba(255,255,255,.6)}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:5px;padding:3px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:12px}
  .seg button{position:relative;border:0;background:transparent;color:rgba(255,255,255,.72);border-radius:9px;height:38px;
    display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:background .18s,color .18s}
  .seg button:active{background:rgba(255,255,255,.08)}
  .seg .paper{width:18px;height:13px;display:flex;align-items:flex-end;justify-content:center}
  .seg .paper i{display:block;border:1.4px solid currentColor;border-radius:1.5px;opacity:.7;transition:all .18s}
  .seg b{font-size:14px;font-weight:600;line-height:1;letter-spacing:.2px}
  .seg kbd{position:absolute;top:3px;right:5px;font-family:var(--mono);font-size:8.5px;line-height:1;opacity:.45}
  .seg button.active{background:#fff;color:var(--brand-dark);box-shadow:0 1px 4px rgba(0,0,0,.18)}
  .seg button.active .paper i{background:var(--brand);border-color:var(--brand);opacity:1}
  .seg button.active kbd{opacity:.5}

  main{max-width:640px;margin:0 auto;padding:var(--pad) var(--pad) 28px}
  .card{background:var(--surface);border-radius:var(--radius);padding:var(--pad);margin-bottom:12px;
    box-shadow:0 1px 2px rgba(15,31,28,.05),0 4px 14px rgba(15,31,28,.04)}

  /* ---------- Hero (ผลสแกนล่าสุด) ---------- */
  .hero{position:relative;border-radius:13px;padding:12px 14px 13px 16px;background:#f6f8f7;overflow:hidden;min-height:118px;
    border:1.5px dashed #cfd8d5;transition:background .2s}
  .hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:transparent}
  .hero.ok{background:var(--ok-soft);border:1.5px solid transparent}.hero.ok::before{background:var(--ok)}
  .hero.warn{background:var(--warn-soft);border:1.5px solid transparent}.hero.warn::before{background:var(--warn)}
  .hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px 3px 7px;
    border-radius:999px;background:#fff;color:var(--muted);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.err{color:var(--err)}.chip.wait{color:#0369a1}
  .hero-size{white-space:nowrap;flex:0 0 auto;font-family:var(--mono);font-weight:600;font-size:12.5px;color:var(--ink);background:#fff;padding:3px 9px;border-radius:8px;
    box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .hero-art{margin-top:9px;display:flex;align-items:baseline;gap:8px}
  .hero-art span{font-size:10px;font-weight:600;letter-spacing:1.2px;color:var(--muted)}
  .hero-art b{font-family:var(--mono);font-size:27px;font-weight:600;line-height:1;letter-spacing:.5px}
  .hero-desc{font-size:15.5px;font-weight:600;line-height:1.35;margin-top:4px;word-break:break-word}
  .hero-code{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
  .hero.idle .hero-desc{font-size:16.5px;color:var(--ink);margin-top:12px}
  .hero.idle .hero-code{font-family:var(--sans)}
  .hero.ok .hero-art b{color:#14532d}.hero.warn .hero-art b{color:#7c2d12}
  .choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .choices button{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid #f0c27a;background:#fff;
    border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
  .choices button b{font-family:var(--mono);font-weight:600;font-size:13.5px;flex:0 0 auto}
  .choices button:active{background:var(--warn-soft)}

  /* ---------- Input ---------- */
  .field{display:flex;align-items:center;gap:8px;margin-top:12px}
  .input-wrap{flex:1;position:relative}
  .input-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
  input{width:100%;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:16px;color:var(--ink);background:#fff}
  #barcode{padding:10px 12px 10px 40px;font-size:15px;font-family:var(--mono);font-weight:500;letter-spacing:.3px}
  #barcode::placeholder{font-family:var(--sans);letter-spacing:0;color:var(--faint)}
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(13,107,95,.15)}
  .icon-btn{flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--muted);
    display:grid;place-items:center;cursor:pointer}
  .icon-btn:active{background:var(--brand-soft)}

  .qty-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
  .qty-row label{font-size:13px;color:var(--muted);font-weight:500}
  .stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .stepper button{width:38px;height:36px;border:0;background:#fff;font-size:19px;color:var(--brand);cursor:pointer;line-height:1}
  .stepper button:active{background:var(--brand-soft)}
  .stepper input{width:46px;border:0;border-left:1.5px solid var(--line);border-right:1.5px solid var(--line);border-radius:0;
    text-align:center;font-family:var(--mono);font-weight:600;font-size:15px;padding:7px 0;-moz-appearance:textfield}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .stepper input:focus{box-shadow:none}

  .foot{display:flex;flex-direction:column;gap:2px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
  .foot .line{display:flex;align-items:center;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(21,128,61,.18)}
  .dot.busy{background:#0284c7;animation:pulse 1s infinite}
  .dot.bad{background:var(--err)}
  @keyframes pulse{50%{opacity:.35}}

  .cfg-err{display:flex;gap:8px;align-items:flex-start;background:var(--err-soft);color:#7f1d1d;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}

  #reader{width:100%;border-radius:12px;overflow:hidden;background:#000;display:none;margin-top:10px}
  #reader.on{display:block}
  .cam-btn{width:100%;margin-top:10px;border:0;border-radius:12px;padding:12px;background:var(--brand);color:#fff;font-size:15px;font-weight:600;cursor:pointer}

  /* ---------- List ---------- */
  .list-head{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 8px}
  .list-head h2{font-size:14px;font-weight:700;margin:0}
  .stats{display:flex;gap:6px}
  .stats span{font-size:11px;font-weight:600;background:var(--brand-soft);color:var(--brand-dark);padding:3px 9px;border-radius:999px}
  .item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .item:first-child{padding-top:2px}
  .item:last-child{border-bottom:0;padding-bottom:2px}
  .badge{flex:0 0 36px;height:36px;border-radius:10px;background:var(--brand-soft);color:var(--brand-dark);
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;line-height:1.05}
  .badge small{font-family:var(--mono);font-size:9.5px;font-weight:600;opacity:.75}
  .item .info{flex:1;min-width:0}
  .item .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .sub{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .sub b{color:var(--ink);font-weight:600}
  .item .st{flex:0 0 auto;color:var(--faint)}
  .item .st.ok{color:var(--ok)}.item .st.warn{color:var(--warn)}.item .st.wait{color:#0284c7}
  .item .undo{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--muted);width:32px;height:32px;border-radius:9px;display:grid;place-items:center;cursor:pointer}
  .item .undo:active{background:var(--err-soft);color:var(--err)}
  .item.cancel{opacity:.45}.item.cancel .nm{text-decoration:line-through}
  .item.notfound .badge{background:var(--warn-soft);color:var(--warn)}
  .empty{text-align:center;color:var(--faint);padding:20px 0 14px;font-size:14px}

  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);background:var(--ink);color:#fff;
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;transition:all .2s;z-index:50;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- สีประจำขนาดป้าย (เปลี่ยนทั้งหน้าตามขนาดที่เลือก) ---------- */
  .sz-A3{--c:#1e3a8a;--c2:#1d4ed8;--cs:#e3ebff}
  .sz-A4{--c:#0a4f47;--c2:#0d6b5f;--cs:#e3f1ee}
  .sz-A5{--c:#5b21b6;--c2:#7c3aed;--cs:#efe7ff}
  .sz-A6{--c:#9a3412;--c2:#c2410c;--cs:#ffecdc}
  body[data-size]{--brand:var(--c2);--brand-dark:var(--c);--brand-soft:var(--cs)}
  header{transition:background-color .25s}
  .badge{background:var(--cs) !important;color:var(--c) !important}
  .hero-size.sz-A3,.hero-size.sz-A4,.hero-size.sz-A5,.hero-size.sz-A6{background:var(--c);color:#fff}
  .seg button[data-size="A3"]{--dot:#93b4ff}.seg button[data-size="A4"]{--dot:#7fd6c6}
  .seg button[data-size="A5"]{--dot:#c4a6ff}.seg button[data-size="A6"]{--dot:#ffb27a}
  .seg button:not(.active) .paper i{border-color:var(--dot);opacity:.9}
  input:focus{box-shadow:0 0 0 3px var(--brand-soft)}
  .hide{display:none !important}
  .bump{animation:bump .35s}
  @keyframes bump{40%{transform:scale(1.18);background:#fff3c4}}

  @media (max-width:340px){ .hero-art b{font-size:24px} .hero-desc{font-size:14.5px} .seg kbd{display:none} }
</style>
</head>
<body class="sz-A4" data-size="A4">

<header>
  <div class="top">
    <div class="brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></div>
      <h1>ขอป้ายราคา</h1>
    </div>
    <div class="branch"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span id="branchName"></span></div>
  </div>
  <div class="seg-label"><span>ขนาดป้าย</span><span>F1–F4</span></div>
  <div class="seg" id="sizeBar" role="radiogroup" aria-label="ขนาดป้าย">
    <button data-size="A3"><span class="paper"><i style="width:17px;height:12px"></i></span><b>A3</b><kbd>F1</kbd></button>
    <button data-size="A4"><span class="paper"><i style="width:14px;height:10px"></i></span><b>A4</b><kbd>F2</kbd></button>
    <button data-size="A5"><span class="paper"><i style="width:11.5px;height:8px"></i></span><b>A5</b><kbd>F3</kbd></button>
    <button data-size="A6"><span class="paper"><i style="width:9px;height:6.5px"></i></span><b>A6</b><kbd>F4</kbd></button>
  </div>
</header>

<main>
  <div class="cfg-err hide" id="cfgErr">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <span>ยังไม่ได้ใส่ <b>SHEET_URL</b> ใน index.html — สแกนได้ แต่ข้อมูลจะค้างในเครื่องจนกว่าจะตั้งค่า</span>
  </div>

  <section class="card">
    <div class="hero idle" id="hero">
      <div class="hero-top">
        <span class="chip" id="heroChip"></span>
        <span class="hero-size" id="heroSize"></span>
      </div>
      <div class="hero-art hide" id="heroArtWrap"><span>ART NO</span><b id="heroArt"></b></div>
      <div class="hero-desc" id="heroDesc">ยิงบาร์โค้ดสินค้าได้เลย</div>
      <div class="hero-code" id="heroCode">กดปุ่มยิงที่ตัวเครื่อง · F1–F4 เปลี่ยนขนาดป้าย</div>
      <div class="choices" id="choices"></div>
    </div>

    <div id="reader"></div>
    <button class="cam-btn hide" id="btnScan">เปิดกล้องสแกน</button>

    <div class="field">
      <div class="input-wrap">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10.5 8v8M14 8v8M17 8v8"/></svg>
        <input id="barcode" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false"
               enterkeyhint="go" placeholder="บาร์โค้ด หรือ Art No" aria-label="บาร์โค้ด" />
      </div>
      <button class="icon-btn" id="btnKeyboard" title="พิมพ์เอง" aria-label="พิมพ์เอง">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M18 13h.01M10 13h4M8 16h8"/></svg>
      </button>
    </div>

    <div class="qty-row">
      <label for="qty">จำนวนป้ายต่อการสแกน</label>
      <div class="stepper">
        <button id="qtyMinus" aria-label="ลด">−</button>
        <input id="qty" type="number" inputmode="numeric" min="1" value="1" />
        <button id="qtyPlus" aria-label="เพิ่ม">+</button>
      </div>
    </div>

    <div class="foot">
      <div class="line"><span class="dot" id="dot"></span><span id="statusText"></span></div>
      <div class="line" style="padding-left:15px" id="dbInfo">กำลังโหลดฐานข้อมูลสินค้า…</div>
    </div>
  </section>

  <section class="card">
    <div class="list-head">
      <h2>รายการรอพิมพ์วันนี้</h2>
      <div class="stats"><span id="statScans">0 สแกน</span><span id="statTags">0 ป้าย</span></div>
    </div>
    <div id="list"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";
  const C = window.CONFIG;
  const $ = (id) => document.getElementById(id);
  const SIZES = ["A3", "A4", "A5", "A6"];
  const LS = { outbox: "ptag_outbox3", rows: "ptag_rows", size: "ptag_size", qty: "ptag_qty" };
  const DB_CACHE = "ptag-db-v1";
  const params = new URLSearchParams(location.search);
  const BRANCH = params.get("branch") || C.BRANCH || "";

  const ICON = {
    check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    alert: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>',
    clock: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    cloud: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 2l20 20M5.8 5.8A6 6 0 0 0 7 18h10a4 4 0 0 0 2.4-.8M21.9 14.5A4 4 0 0 0 17.5 10a6 6 0 0 0-7.4-4.5"/></svg>',
    scan: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg>',
    minus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg>',
    x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    ban: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="m5.7 5.7 12.6 12.6"/></svg>'
  };

  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  let outbox = load(LS.outbox, []);
  let currentSize = params.get("size") || load(LS.size, C.DEFAULT_SIZE || "A4");

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const isEditable = (el) => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
  const norm = (code) => String(code).trim().replace(/^0+(?=.)/, "");
  const getQty = () => Math.max(1, Math.min(999, parseInt($("qty").value || "1", 10) || 1));

  let toastTimer;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.className = "toast show"; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = "toast", 1600); }

  // ---------- เสียง ----------
  let actx = null;
  function tone(freq, dur, delay = 0) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + delay;
      o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.15, t0); o.start(t0); o.stop(t0 + dur);
    } catch {}
  }
  function beep(kind) {
    if (!C.BEEP) return;
    if (kind === "ok") { tone(1500, 0.09); try { navigator.vibrate?.(60); } catch {} }
    else if (kind === "warn") { tone(700, 0.12); tone(700, 0.12, 0.18); try { navigator.vibrate?.([80, 60, 80]); } catch {} }
    else if (kind === "err") { tone(300, 0.35); try { navigator.vibrate?.(300); } catch {} }
  }

  // ---------- ฐานข้อมูลสินค้า ----------
  const byBarcode = new Map(), byArt = new Map();
  async function loadDb() {
    const url = new URL(C.PRODUCTS_URL, location.href).href;
    let data = null, offline = false;
    try {
      const res = await fetch(url, { cache: "no-cache" });
      if (!res.ok) throw new Error(res.status);
      const copy = res.clone(); data = await res.json();
      try { const c = await caches.open(DB_CACHE); await c.put(url, copy); } catch {}
    } catch {
      try { const c = await caches.open(DB_CACHE); const r = await c.match(url); if (r) { data = await r.json(); offline = true; } } catch {}
    }
    if (!data) { $("dbInfo").textContent = "โหลดฐานข้อมูลสินค้าไม่ได้ — สแกนได้ แต่ไม่แสดง Art No"; return; }
    for (const [bc, art, descr, dept] of data.items) {
      const p = { artNo: String(art), descr, dept: String(dept ?? "") };
      const k = norm(bc), arr = byBarcode.get(k);
      if (!arr) byBarcode.set(k, [p]); else if (!arr.some(x => x.artNo === p.artNo)) arr.push(p);
      if (!byArt.has(p.artNo)) byArt.set(p.artNo, p);
    }
    $("dbInfo").textContent = `ฐานข้อมูล ${data.items.length.toLocaleString()} รายการ · อัปเดต ${data.updated || "-"}${offline ? " · ออฟไลน์" : ""}`;
  }
  // บาร์โค้ดภายในร้าน 13 หลักขึ้นต้นด้วย 250000 → Art No คือหลักที่ 7–12 (เช่น 2500002503151 → 250315)
  const inStoreArt = (code) => /^250000\d{7}$/.test(code) ? code.slice(6, 12).replace(/^0+(?=.)/, "") : "";
  function lookup(code) {
    const art25 = inStoreArt(code);
    if (art25 && byArt.has(art25)) return [byArt.get(art25)];
    const k = norm(code), hits = byBarcode.get(k);
    if (hits && hits.length) return hits;
    const a = byArt.get(k);
    return a ? [a] : [];
  }

  // ---------- ขนาดป้าย ----------
  function setSize(s, announce) {
    if (!SIZES.includes(s)) return;
    currentSize = s; save(LS.size, s);
    document.body.className = "sz-" + s; document.body.dataset.size = s;
    document.querySelector('meta[name="theme-color"]').setAttribute("content", getComputedStyle(document.body).getPropertyValue("--c").trim());
    document.querySelectorAll("#sizeBar button").forEach(b => {
      const on = b.dataset.size === s; b.classList.toggle("active", on); b.setAttribute("aria-checked", on);
    });
    if (pendingChoice) { pendingChoice.size = s; $("heroSize").textContent = `${s} × ${pendingChoice.qty}`; $("heroSize").className = "hero-size sz-" + s; }
    if ($("hero").classList.contains("idle")) { $("heroSize").textContent = s; $("heroSize").className = "hero-size sz-" + s; }
    if (announce) { toast("ขนาดป้าย " + s); tone(1000, 0.05); }
  }
  $("sizeBar").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-size]"); if (b) { setSize(b.dataset.size, true); focusBarcode(); }
  });

  // ---------- จำนวน ----------
  $("qty").value = load(LS.qty, 1);
  function setQty(n) { $("qty").value = Math.max(1, Math.min(999, n)); save(LS.qty, getQty()); }
  $("qtyMinus").addEventListener("click", () => { setQty(getQty() - 1); focusBarcode(); });
  $("qtyPlus").addEventListener("click", () => { setQty(getQty() + 1); focusBarcode(); });
  $("qty").addEventListener("change", () => setQty(getQty()));

  // ---------- โฟกัสช่องบาร์โค้ด ----------
  function focusBarcode() { const el = $("barcode"); if (document.activeElement !== el) el.focus({ preventScroll: true }); }
  document.addEventListener("click", (e) => { if (!isEditable(e.target) && !e.target.closest("button")) focusBarcode(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { focusBarcode(); flush(); sync(); } });
  $("btnKeyboard").addEventListener("click", () => {
    const el = $("barcode"); el.setAttribute("inputmode", "text"); el.blur(); setTimeout(() => el.focus(), 30);
    el.addEventListener("blur", () => el.setAttribute("inputmode", "none"), { once: true });
  });

  // ---------- รับข้อมูลจากหัวสแกน (Keyboard Wedge + Enter/Tab) ----------
  let buf = "", bufStart = 0, lastKey = 0;
  document.addEventListener("keydown", (e) => {
    const fIdx = ["F1", "F2", "F3", "F4"].indexOf(e.key);
    if (fIdx >= 0) { e.preventDefault(); setSize(SIZES[fIdx], true); return; }
    const now = performance.now(), t = e.target;
    if (e.key === "Enter" || e.key === "Tab") {
      const fast = buf.length >= 4 && (lastKey - bufStart) / Math.max(1, buf.length - 1) < 45;
      if (t && t.id === "barcode") { e.preventDefault(); const v = t.value; t.value = ""; buf = ""; scan(v); return; }
      if (!isEditable(t) && buf.length >= 3) { e.preventDefault(); const v = buf; buf = ""; scan(v); return; }
      if (fast && isEditable(t)) {
        e.preventDefault(); const v = buf; buf = "";
        if (t.value.endsWith(v)) t.value = t.value.slice(0, -v.length);
        scan(v); return;
      }
      buf = ""; return;
    }
    if (e.key && e.key.length === 1) { if (now - lastKey > 50) { buf = ""; bufStart = now; } buf += e.key; lastKey = now; }
  }, true);

  // ---------- สแกน ----------
  let pendingChoice = null;
  function scan(raw) {
    const barcode = String(raw).replace(/[\r\n\t]/g, "").trim();
    if (!barcode) return;
    if (pendingChoice) { const pc = pendingChoice; pendingChoice = null; commit(pc, pc.options[0], true); }
    const base = { barcode, size: currentSize, qty: getQty() };
    const hits = lookup(barcode);
    if (hits.length > 1) {
      pendingChoice = Object.assign(base, { options: hits });
      beep("warn");
      setHero("warn", { chip: ["warn", ICON.alert, "มีหลาย Art No — แตะเลือก"], size: `${base.size} × ${base.qty}`, sz: base.size,
        desc: "เลือกสินค้าที่ต้องการ", code: barcode });
      $("choices").innerHTML = hits.map((h, i) => `<button data-i="${i}"><b>${esc(h.artNo)}</b><span>${esc(h.descr)}</span></button>`).join("");
      return;
    }
    const art25 = inStoreArt(barcode);
    // ไม่อยู่ในฐานข้อมูล แต่เป็นบาร์โค้ด 25… → ยังได้ Art No จากหลัก 7–12
    commit(base, hits[0] || (art25 ? { artNo: art25, descr: "", dept: "", notInDb: true } : null), false);
  }
  $("choices").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-i]"); if (!b || !pendingChoice) return;
    const pc = pendingChoice; pendingChoice = null;
    commit(pc, pc.options[+b.dataset.i], false); focusBarcode();
  });

  // ---------- รายการ = ข้อมูลจริงใน Google Sheet (แถว "รอพิมพ์" ของสาขาที่สแกนวันนี้) + สแกนที่ยังส่งไม่ถึง ----------
  // หลังบ้านลบแถว / เปลี่ยนสถานะเป็นพิมพ์แล้ว / แก้จำนวนในชีต → รายการในเครื่องเปลี่ยนตามในรอบซิงก์ถัดไป
  const todaySince = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.toISOString(); };
  const keyFor = (artNo, barcode, size) => `${artNo ? "A" + artNo : "B" + norm(barcode)}|${size}`;
  let serverRows = load(LS.rows, { since: "", rows: [] });
  if (serverRows.since !== todaySince()) serverRows = { since: todaySince(), rows: [] };
  function setServerRows(rows) { serverRows = { since: todaySince(), rows: rows || [] }; save(LS.rows, serverRows); }

  function mergedLines() {
    const m = new Map();
    for (const r of serverRows.rows) m.set(r.k, { ...r, pending: 0 });
    for (const e of outbox) {
      let l = m.get(e.lineKey);
      if (!l) { l = { k: e.lineKey, artNo: e.artNo, barcode: e.barcode, descr: e.descr, size: e.size, qty: 0, last: e.scannedAt, pending: 0 }; m.set(e.lineKey, l); }
      l.qty += e.qty; l.pending++;
      if ((e.scannedAt || "") > (l.last || "")) l.last = e.scannedAt;
    }
    return [...m.values()].filter(l => l.qty > 0).sort((a, b) => (b.last || "").localeCompare(a.last || ""));
  }
  const lineOf = (k) => mergedLines().find(l => l.k === k);

  function queueEvent(k, info, delta, barcode) {
    outbox.push({ id: uid(), lineKey: k, barcode: barcode || info.barcode, artNo: info.artNo || "", descr: info.descr || "",
      dept: info.dept || "", size: info.size, qty: delta, scannedAt: new Date().toISOString() });
    save(LS.outbox, outbox);
  }

  function commit(base, product, quiet) {
    const k = keyFor(product ? product.artNo : "", base.barcode, base.size);
    const before = lineOf(k);
    queueEvent(k, { artNo: product ? product.artNo : "", descr: product ? product.descr : "", dept: product ? product.dept : "",
      size: base.size, barcode: base.barcode }, base.qty, base.barcode);
    const line = lineOf(k);
    if (!quiet) {
      const ok = product && !product.notInDb;
      beep(ok ? "ok" : "warn");
      setHero(ok ? "ok" : "warn", {
        chip: ["wait", ICON.clock, before ? `เพิ่ม +${base.qty} · กำลังบันทึก…` : "กำลังบันทึก…"],
        size: `${base.size} · ${line ? line.qty : base.qty} ป้าย`, sz: base.size,
        art: product ? product.artNo : "", desc: ok ? product.descr : "ไม่พบในฐานข้อมูล", code: base.barcode
      });
      heroKey = k;
      if (before) bump();
    }
    render(); flush();
  }
  function bump() { const el = $("heroSize"); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }

  // ---------- ส่งเข้า Sheet อัตโนมัติ ----------
  let sending = false, retryTimer = null, lastError = "", heroKey = null, syncSeq = 0;
  const inFlight = new Set();
  async function post(body) {
    const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 20000);
    try {
      const res = await fetch(C.SHEET_URL, { method: "POST", body: JSON.stringify(body), signal: ctrl.signal });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "ส่งไม่สำเร็จ");
      return data;
    } finally { clearTimeout(tm); }
  }
  function heroSentState() {
    if (pendingChoice || !heroKey) return;
    const line = lineOf(heroKey);
    if (!line) return;
    if (line.pending === 0) {
      $("heroSize").textContent = `${line.size} · ${line.qty} ป้าย`;
      setChip(line.descr ? "ok" : "warn", ICON.check, line.descr ? "บันทึกลง Sheet แล้ว" : "บันทึกแล้ว · ไม่พบข้อมูลสินค้า");
    } else if (lastError) setChip("err", ICON.cloud, "ยังไม่ส่ง · จะส่งให้อัตโนมัติ");
  }
  async function flush() {
    if (sending || !outbox.length || !C.SHEET_URL) { updateStatus(); return; }
    sending = true; syncSeq++; updateStatus();
    const batch = outbox.slice(0, 100);
    batch.forEach(e => inFlight.add(e.id));
    try {
      const data = await post({ action: "scan", branch: BRANCH, since: todaySince(), device: navigator.userAgent.slice(0, 100),
        items: batch.map(({ id, barcode, artNo, descr, dept, size, qty, scannedAt }) => ({ id, barcode, artNo, descr, dept, size, qty, scannedAt })) });
      const ids = new Set(batch.map(e => e.id));
      outbox = outbox.filter(e => !ids.has(e.id)); save(LS.outbox, outbox);
      if (Array.isArray(data.rows)) setServerRows(data.rows);
      lastError = "";
    } catch (err) {
      lastError = err?.name === "AbortError" ? "หมดเวลาเชื่อมต่อ" : (err instanceof TypeError ? "ไม่มีสัญญาณ" : (err?.message || String(err)));
      if (batch.some(e => e.lineKey === heroKey)) beep("err");
      clearTimeout(retryTimer); retryTimer = setTimeout(flush, 10000);
    } finally {
      batch.forEach(e => inFlight.delete(e.id));
      sending = false; heroSentState(); render(); updateStatus();
      if (outbox.length && !lastError) flush();
    }
  }
  // ดึงรายการล่าสุดจากชีต (กรณีหลังบ้านลบ/แก้ไข)
  async function sync() {
    if (sending || outbox.length || !C.SHEET_URL || document.hidden) return;
    const seq = ++syncSeq;
    try {
      const url = `${C.SHEET_URL}?action=list&branch=${encodeURIComponent(BRANCH)}&since=${encodeURIComponent(todaySince())}`;
      const res = await fetch(url, { cache: "no-store" });
      const data = await res.json();
      if (seq !== syncSeq || sending || outbox.length || !data.ok) return;   // มีสแกนใหม่ระหว่างรอ → ข้ามรอบนี้
      setServerRows(data.rows); lastError = ""; heroSentState(); render(); updateStatus();
    } catch {}
  }
  window.addEventListener("online", () => { flush(); sync(); });
  setInterval(() => { if (outbox.length && !sending) flush(); else sync(); }, (C.SYNC_SECONDS || 20) * 1000);

  // ---------- ลดจำนวนทีละ 1 (กรณียิงเกิน) ----------
  function decrement(k) {
    const line = lineOf(k); if (!line || line.qty <= 0) return;
    // ถ้ายังมีรายการ + ที่ยังไม่ได้ส่ง ให้หักจากตัวนั้นเลย ไม่ต้องส่งเพิ่ม
    const ev = [...outbox].reverse().find(e => e.lineKey === k && e.qty > 0 && !inFlight.has(e.id));
    if (ev) {
      ev.qty -= 1;
      if (ev.qty === 0) outbox = outbox.filter(e => e !== ev);
      save(LS.outbox, outbox);
    } else queueEvent(k, line, -1);
    const after = lineOf(k), left = after ? after.qty : 0;
    if (heroKey === k) { $("heroSize").textContent = `${line.size} · ${left} ป้าย`; bump(); }
    toast(left > 0 ? `ลดเหลือ ${left} ป้าย` : "ลบรายการแล้ว");
    tone(600, 0.06);
    render(); flush(); focusBarcode();
  }

  // ---------- แสดงผล ----------
  function setChip(kind, icon, text) { const c = $("heroChip"); c.className = "chip " + kind; c.innerHTML = icon + `<span>${esc(text)}</span>`; }
  function setHero(type, d) {
    $("hero").className = "hero " + type;
    setChip(...d.chip);
    $("heroSize").textContent = d.size || "";
    $("heroSize").className = "hero-size" + (d.sz ? " sz-" + d.sz : "");
    $("heroArtWrap").classList.toggle("hide", !d.art);
    $("heroArt").textContent = d.art || "";
    $("heroDesc").textContent = d.desc || "";
    $("heroCode").textContent = d.code || "";
    $("choices").innerHTML = "";
  }
  function updateStatus() {
    const dot = $("dot"), st = $("statusText"), n = outbox.length;
    if (!C.SHEET_URL) { dot.className = "dot bad"; st.textContent = `ยังไม่ได้ตั้งค่า SHEET_URL · ค้างในเครื่อง ${n} รายการ`; return; }
    if (sending) { dot.className = "dot busy"; st.textContent = `กำลังส่ง ${n} รายการ…`; return; }
    if (n) { dot.className = "dot bad"; st.textContent = `ค้างส่ง ${n} รายการ · ${lastError || "รอส่ง"} · จะลองใหม่อัตโนมัติ`; return; }
    dot.className = "dot on"; st.textContent = "เชื่อมต่อ Google Sheet แล้ว · ซิงก์รายการอัตโนมัติ";
  }
  function render() {
    const list = mergedLines();
    $("statScans").textContent = `${list.length} รายการ`;
    $("statTags").textContent = `${list.reduce((a, l) => a + l.qty, 0)} ป้าย`;
    if (!list.length) { $("list").innerHTML = '<div class="empty">ยังไม่มีรายการรอพิมพ์วันนี้</div>'; return; }
    $("list").innerHTML = list.slice(0, 80).map(l => {
      const found = !!l.descr;
      const st = l.pending > 0 ? ["wait", ICON.clock] : found ? ["ok", ICON.check] : ["warn", ICON.alert];
      return `
      <div class="item${found ? "" : " notfound"}">
        <div class="badge sz-${l.size}">${l.size}<small>×${l.qty}</small></div>
        <div class="info">
          <div class="nm">${esc(l.descr || "ไม่พบในฐานข้อมูล")}</div>
          <div class="sub">${l.artNo ? `<b>${esc(l.artNo)}</b> · ` : ""}${esc(l.barcode)}</div>
        </div>
        <span class="st ${st[0]}">${st[1]}</span>
        <button class="undo" data-key="${esc(l.k)}" aria-label="ลด 1 ป้าย" title="ลด 1 ป้าย">${ICON.minus}</button>
      </div>`;
    }).join("");
  }
  $("list").addEventListener("click", (e) => {
    const b = e.target.closest("button.undo"); if (b) decrement(b.dataset.key);
  });

  // ---------- กล้อง (CONFIG.ENABLE_CAMERA) ----------
  if (C.ENABLE_CAMERA) {
    $("btnScan").classList.remove("hide");
    const s = document.createElement("script"); s.src = "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"; document.head.appendChild(s);
    let scanner = null, on = false, last = "", lastT = 0;
    $("btnScan").addEventListener("click", async () => {
      if (on) { try { await scanner.stop(); } catch {} on = false; $("reader").classList.remove("on"); $("btnScan").textContent = "เปิดกล้องสแกน"; return; }
      if (typeof Html5Qrcode === "undefined") { toast("โหลดไลบรารีกล้องไม่สำเร็จ"); return; }
      $("reader").classList.add("on");
      scanner = scanner || new Html5Qrcode("reader", { experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
      try {
        await scanner.start({ facingMode: "environment" }, { fps: 12, qrbox: (w, h) => ({ width: Math.min(w * .85, 320), height: Math.min(h * .45, 160) }) },
          (txt) => { const n = Date.now(); if (txt === last && n - lastT < 2500) return; last = txt; lastT = n; scan(txt); }, () => {});
        on = true; $("btnScan").textContent = "ปิดกล้อง";
      } catch (err) { $("reader").classList.remove("on"); toast("เปิดกล้องไม่ได้"); }
    });
  }

  // ---------- เริ่มต้น ----------
  $("branchName").textContent = BRANCH;
  if (!C.SHEET_URL) $("cfgErr").classList.remove("hide");
  setChip("", ICON.scan, "พร้อมสแกน");
  setSize(SIZES.includes(currentSize) ? currentSize : "A4");
  render(); updateStatus(); focusBarcode(); flush(); sync(); loadDb();
})();
</script>
</body>
</html>
